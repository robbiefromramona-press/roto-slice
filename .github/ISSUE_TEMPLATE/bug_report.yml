name: Bug report
description: Something is broken or behaves strangely
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Drop in a file  2. Click ...  3. See the problem"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Chrome 140 on Windows 11"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: "Please do NOT attach private audio or video. A description or a short public sample is enough."
